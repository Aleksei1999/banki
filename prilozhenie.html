<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--w:#fff;--blue:#1E49C4}
html,body{height:100%}
img{display:block;max-width:100%;height:auto}
body{font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--w);
  background:#2A5CE6;-webkit-font-smoothing:antialiased}
.stage{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(1100px 720px at 6% -6%,#4C86FF 0%,transparent 58%),
             radial-gradient(900px 720px at 104% 106%,#1436A8 0%,transparent 62%),
             linear-gradient(135deg,#3E7AFA 0%,#2A5CE6 46%,#1B44C6 100%)}
.stage:before{content:"";position:absolute;top:-30%;left:-25%;width:45%;height:180%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);
  transform:rotate(12deg);pointer-events:none}

/* ── шапка ── */
.top{position:relative;z-index:3;padding:24px 44px 0}
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:var(--w)}
.brand img{height:38px;width:auto}
.brand b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:1.32rem;letter-spacing:-.02em}
.brand b i{font-style:normal;opacity:.72}

/* ── сетка ── */
.wrap{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:1.12fr .88fr;
  align-items:center;gap:28px;max-width:1240px;width:100%;margin:0 auto;padding:12px 44px 40px}

.pill{display:inline-flex;align-items:center;background:var(--w);color:var(--blue);border-radius:999px;
  padding:10px 22px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.72rem;
  letter-spacing:.15em;text-transform:uppercase;box-shadow:0 8px 22px rgba(8,20,70,.18)}
h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(2.1rem,3.9vw,3.9rem);
  line-height:1.04;letter-spacing:-.035em;margin:18px 0 0;white-space:nowrap}
.lead{font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.58;color:#DCE7FF;margin-top:15px;max-width:29em}

.after{max-width:540px}
.banner{width:min(410px,100%);margin-top:24px}
.days{display:block;font-size:.9rem;color:#B9CDFF;margin-top:9px;margin-bottom:2px}
.sorry{width:min(320px,100%);margin-top:14px;opacity:.9}

.cta{display:flex;flex-direction:column;align-items:flex-start;gap:15px;margin-top:20px}
.imgbtn{display:inline-block;transition:transform .18s}
a.imgbtn:hover{transform:translateY(-2px)}
.imgbtn.back img{height:56px;width:auto}
.storehead{display:none}
.stores{display:flex;gap:10px;flex-wrap:wrap}
.stores img{height:46px;width:auto}

/* ── иллюстрация ── */
.art{display:flex;align-items:center;justify-content:center}
.art img{width:100%;max-width:560px;filter:drop-shadow(0 30px 52px rgba(6,18,70,.34))}

/* ── мобильная версия ── */
@media(max-width:920px){
  .top{padding:24px 20px 0;display:flex;justify-content:center}
  .brand img{height:32px}.brand b{font-size:1.16rem}
  .wrap{grid-template-columns:1fr;gap:0;padding:20px 20px 40px;text-align:center;align-content:start;
    justify-items:center}
  .txt{display:contents}
  .pill{margin-top:10px}
  h1{font-size:clamp(2.1rem,10vw,3rem);margin-top:16px;white-space:normal}
  .lead{margin-top:14px;font-size:1.03rem;max-width:24em}
  .art{order:2;margin:20px 0 6px}
  .art img{max-width:min(360px,86vw)}
  .after{order:3;display:flex;flex-direction:column;align-items:center;width:100%;max-width:430px}
  .banner{margin-top:8px;width:100%}
  .days{margin-top:10px}
  .cta{flex-direction:column;align-items:stretch;width:100%;margin-top:22px;gap:16px}
  .imgbtn.back{display:flex;justify-content:center}
  .imgbtn.back img{height:auto;width:100%}
  .storehead{display:block;font-size:.9rem;color:#C4D7FF;margin-bottom:-6px}
  .stores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:center}
  .stores img{height:auto;width:100%}
  .sorry{order:9;width:min(300px,80%);margin-top:26px}
}
@media(max-width:430px){.stores{gap:6px}.storehead{font-size:.85rem}}
@media(min-width:921px) and (max-height:820px){
  .top{padding:18px 44px 0}
  .wrap{padding:8px 44px 26px;gap:24px}
  h1{font-size:clamp(2rem,3.4vw,3.2rem);margin-top:14px}
  .lead{margin-top:12px;font-size:1rem}
  .banner{margin-top:18px;width:min(380px,100%)}
  .sorry{margin-top:16px;width:min(290px,100%)}
  .cta{margin-top:12px}
  .imgbtn.back img{height:50px}.stores img{height:42px}
  .art img{max-width:470px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
