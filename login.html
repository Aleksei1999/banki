<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в личный кабинет — Списали.com</title>
<meta name="description" content="Личный кабинет клиента Списали.com">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161D2E; --blue:#2563EB; --blue-600:#1D4ED8; --blue-700:#1B3AA0;
  --blue-050:#EAF1FF; --blue-025:#F5F8FF; --text:#1E273A; --muted:#5A6478;
  --bg:#FFFFFF; --bg-soft:#F4F7FE; --border:#E6ECF4; --white:#fff;
  --gold:#F4B740; --ok:#16A34A; --radius:20px; --radius-sm:12px; --radius-lg:28px;
  --shadow-sm:0 2px 10px rgba(22,29,46,.05);
  --shadow:0 18px 44px rgba(22,29,46,.10);
  --shadow-lg:0 40px 90px rgba(22,29,46,.18);
  --maxw:1180px; --ease:cubic-bezier(.2,.7,.2,1);
  --font-head:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:17px}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
h1,h2,h3,h4{margin:0;font-family:var(--font-head);line-height:1.08;letter-spacing:-.03em;font-weight:800;color:var(--ink)}
h2{font-size:clamp(1.9rem,4vw,3rem)}
h3{font-size:1.28rem;font-weight:700;letter-spacing:-.02em}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.82rem;letter-spacing:.04em;
  text-transform:uppercase;color:var(--blue);background:var(--blue-050);padding:8px 15px;border-radius:999px;font-family:var(--font-body)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:1rem;font-family:var(--font-body);
  padding:15px 26px;border-radius:14px;cursor:pointer;border:0;transition:transform .18s var(--ease),box-shadow .2s var(--ease),background .2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 26px rgba(37,99,235,.30)}
.btn-primary:hover{background:var(--blue-600);transform:translateY(-2px);box-shadow:0 18px 34px rgba(37,99,235,.36)}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.btn-lg{padding:18px 34px;font-size:1.08rem}
.btn:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}
body{padding-top:77px}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(22,29,46,.06)}
.nav{display:flex;align-items:center;gap:26px;height:76px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-head);font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
.brand img{height:40px;width:auto}
.brand .w1{color:var(--ink)} .brand .w2{color:var(--ink)}
.nav-links{display:flex;gap:26px;margin-left:14px}
.nav-links a{color:var(--ink);font-weight:600;font-size:.97rem;opacity:.85;transition:opacity .2s}
.nav-links a:hover{opacity:1;color:var(--blue)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.nav-phone{font-family:var(--font-head);font-weight:800;color:var(--ink);font-size:1.05rem;white-space:nowrap;letter-spacing:-.01em}
.nav-phone span{display:block;font-size:.7rem;font-weight:600;color:var(--muted);font-family:var(--font-body);letter-spacing:0}
.nav-login{font-weight:700;font-size:.97rem;color:var(--ink);border:1.5px solid var(--border);padding:11px 18px;border-radius:12px;transition:border-color .2s,color .2s}
.nav-login:hover{border-color:var(--blue);color:var(--blue)}
.burger{display:none;background:none;border:0;cursor:pointer;padding:6px}
.mnav{display:none}
footer{background:var(--ink);color:#C2CBDC;padding:58px 0 30px;font-size:.95rem}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:34px}
.foot-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:1.25rem;color:#fff;margin-bottom:14px}
.foot-brand img{height:36px}
.foot-brand .w2{color:#6FA0FF}
footer h4{color:#fff;font-size:.95rem;margin:0 0 14px;font-weight:700;font-family:var(--font-head)}
footer ul{list-style:none;padding:0;margin:0}
footer li{margin-bottom:9px}
footer a{color:#C2CBDC;transition:color .2s}
footer a:hover{color:#fff}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:38px;padding-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.82rem;color:#8A96AD}
.disclaimer{font-size:.8rem;color:#8A96AD;line-height:1.5;margin-top:10px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
/* ==== QUIZ (shared: inline + modal) ==== */
.quiz-card{background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden}
.quiz-prog{height:7px;background:var(--blue-050)}
.quiz-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#63A0FF);width:0;transition:width .45s var(--ease);border-radius:0 6px 6px 0}
.quiz-inner{padding:30px 30px 32px}
.quiz-count{font-family:var(--font-body);font-size:.8rem;font-weight:700;color:var(--blue);letter-spacing:.05em;text-transform:uppercase}
.quiz-q{font-family:var(--font-head);font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px;color:var(--ink)}
.quiz-hint{color:var(--muted);font-size:.96rem;margin-bottom:20px}
.quiz-opts{display:flex;flex-direction:column;gap:11px}
.quiz-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:1.6px solid var(--border);
  border-radius:15px;padding:16px 18px;font-size:1.04rem;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--font-body);
  transition:border-color .18s,background .18s,transform .12s,box-shadow .18s}
.quiz-opt:hover{border-color:var(--blue);background:var(--blue-025);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.quiz-opt:focus-visible{outline:3px solid rgba(37,99,235,.4);outline-offset:2px}
.quiz-opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none;transition:.18s}
.quiz-opt:hover .dot{border-color:var(--blue);box-shadow:inset 0 0 0 4px var(--blue)}
.quiz-back{margin-top:20px;background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.quiz-back:hover{color:var(--ink)}
.quiz-result{text-align:center}
.quiz-result .rico{width:74px;height:74px;border-radius:50%;background:#E7F7EE;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:2px auto 16px}
.quiz-result h3{font-size:1.7rem}
.quiz-sum{background:var(--bg-soft);border-radius:14px;padding:15px 18px;margin:18px 0;text-align:left;font-size:.95rem;color:var(--ink)}
.quiz-sum b{color:var(--blue);font-family:var(--font-body)}
.quiz-form{display:flex;flex-direction:column;gap:11px;margin-top:6px;text-align:left}
.quiz-form input{width:100%;padding:15px 16px;border:1.6px solid var(--border);border-radius:13px;font-size:1rem;font-family:var(--font-body);transition:.18s}
.quiz-form input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.quiz-form .btn{width:100%;margin-top:4px}
.quiz-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:2px}
.quiz-trust{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:.85rem;font-weight:600}
.quiz-trust span{display:inline-flex;align-items:center;gap:6px}
.quiz-trust svg{color:var(--ok)}
/* modal chrome */
.quiz-overlay{position:fixed;inset:0;z-index:100;background:rgba(16,22,38,.6);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}
.quiz-overlay.show{display:flex}
.quiz-modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;position:relative;animation:qpop .3s var(--ease);background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid var(--border);-webkit-overflow-scrolling:touch}
@keyframes qpop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.quiz-modal .quiz-close{position:absolute;top:14px;right:14px;z-index:2;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--muted);padding:7px;line-height:0}
.quiz-modal .quiz-close:hover{color:var(--ink);border-color:var(--blue)}
@media(max-width:940px){.foot-grid{grid-template-columns:1fr 1fr}.nav-links,.nav-phone,.nav-login{display:none}.burger{display:block}
  .mnav.show{display:block;padding:10px 22px 20px;border-top:1px solid var(--border);background:#fff}
  .mnav a{display:block;padding:12px 4px;font-weight:600;border-bottom:1px solid var(--border)}}
@media(max-width:560px){body{font-size:16px}.foot-grid{grid-template-columns:1fr}.quiz-q{font-size:1.3rem}.quiz-inner{padding:24px 20px}
  .nav-cta{display:none}.nav{gap:14px}.brand{font-size:1.18rem}.brand img{height:34px}
  .quiz-overlay{padding:12px}.quiz-modal{max-height:94vh}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}.btn:hover{transform:none}.quiz-modal{animation:none}}

/* ===== AUTH ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;
  background:radial-gradient(1000px 500px at 80% -10%,rgba(37,99,235,.16),transparent 60%),radial-gradient(700px 400px at -5% 10%,rgba(37,99,235,.08),transparent 55%),linear-gradient(180deg,#fff,var(--bg-soft))}
.auth-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow-lg);padding:36px 34px}
.auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--font-head);font-weight:800;font-size:1.3rem;margin-bottom:8px}
.auth-brand img{height:40px}.auth-brand .w2{color:var(--blue)}
.auth-card h1{font-size:1.6rem;text-align:center;margin-top:14px}
.auth-card .sub{color:var(--muted);text-align:center;margin:8px 0 22px;font-size:.98rem}
.afield{margin-bottom:15px}
.afield label{display:block;font-weight:600;font-size:.86rem;margin-bottom:6px;color:var(--ink)}
.afield input{width:100%;padding:15px 16px;border:1.6px solid var(--border);border-radius:13px;font-size:1rem;font-family:var(--font-body);transition:.18s}
.afield input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.auth-card .btn{width:100%;margin-top:8px}
.auth-alt{text-align:center;margin-top:20px;color:var(--muted);font-size:.95rem}
.auth-alt a{color:var(--blue);font-weight:700}
.auth-row{display:flex;gap:12px}.auth-row .afield{flex:1}
.auth-legal{font-size:.76rem;color:var(--muted);text-align:center;margin-top:16px;line-height:1.45}
.auth-legal a{color:var(--blue);text-decoration:underline}
.auth-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:.9rem;margin-top:22px;justify-content:center;width:100%}
.auth-back:hover{color:var(--blue)}
.pw-hint{font-size:.78rem;color:var(--muted);margin-top:6px}
/* ===== APP SHELL ===== */
.appbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border)}
.appbar-in{display:flex;align-items:center;gap:20px;height:70px;max-width:1200px;margin:0 auto;padding:0 22px}
.appbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:1.2rem}
.appbar .brand img{height:34px}.appbar .brand .w2{color:var(--blue)}
.appbar .tolink{color:var(--muted);font-weight:600;font-size:.92rem;margin-left:6px}
.appbar .tolink:hover{color:var(--blue)}
.appbar-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.bell{position:relative;color:var(--ink);background:var(--bg-soft);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border)}
.bell:after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;background:var(--gold);border-radius:50%;border:2px solid #fff}
.uchip{display:flex;align-items:center;gap:10px}
.uchip .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#5B8CFF);color:#fff;font-family:var(--font-head);font-weight:800;display:flex;align-items:center;justify-content:center}
.uchip b{font-size:.94rem;display:block}.uchip span{font-size:.78rem;color:var(--muted)}
.logout{color:var(--muted);font-weight:600;font-size:.9rem;border:1px solid var(--border);padding:9px 14px;border-radius:11px}
.logout:hover{color:var(--blue);border-color:var(--blue)}
.app-main{max-width:1200px;margin:0 auto;padding:30px 22px 70px}
.greet h1{font-size:clamp(1.6rem,3.4vw,2.2rem)}
.greet p{color:var(--muted);margin-top:8px;font-size:1.05rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}
.kpi{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow-sm)}
.kpi .k-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .k-lbl{color:var(--muted);font-size:.85rem;font-weight:600}
.kpi .k-val{font-family:var(--font-head);font-weight:800;font-size:1.4rem;margin-top:3px;letter-spacing:-.02em}
.kpi .k-sub{font-size:.82rem;margin-top:4px;font-weight:600}
.ic-blue{background:var(--blue-050);color:var(--blue)}.ic-green{background:#E7F7EE;color:var(--ok)}
.ic-gold{background:#FEF3DA;color:#B4820E}.ic-purple{background:#EEE9FF;color:#6D5AE6}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:700}
.b-green{background:#E7F7EE;color:var(--ok)}.b-gold{background:#FEF3DA;color:#B4820E}.b-grey{background:#EEF1F6;color:#6B7482}.b-blue{background:var(--blue-050);color:var(--blue)}
.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:26px;box-shadow:var(--shadow-sm);margin-bottom:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.panel-h h2{font-size:1.3rem}
.panel-h .badge{flex:none}
/* journey */
.jsteps{display:flex;gap:0}
.jstep{flex:1;text-align:center;position:relative;padding:0 4px}
.jstep:before{content:"";position:absolute;top:22px;left:calc(-50% + 22px);width:100%;height:3px;background:var(--border);z-index:0}
.jstep:first-child:before{display:none}
.jstep.done:before,.jstep.active:before{background:var(--ok)}
.jdot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:800;background:#fff;border:2.5px solid var(--border);color:var(--muted);transition:.2s}
.jstep.done .jdot{background:var(--ok);border-color:var(--ok);color:#fff}
.jstep.active .jdot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 6px rgba(37,99,235,.16)}
.jlabel{font-size:.86rem;font-weight:700;color:var(--ink);line-height:1.25}
.jstep:not(.done):not(.active) .jlabel{color:var(--muted);font-weight:600}
.jdate{font-size:.75rem;color:var(--muted);margin-top:3px}
.jnow{margin-top:20px;background:var(--blue-025);border:1px solid #D7E3FB;border-radius:14px;padding:14px 18px;font-size:.96rem;display:flex;gap:10px;align-items:flex-start}
.jnow svg{color:var(--blue);flex:none;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start}
/* timeline */
.tl{position:relative;padding-left:8px}
.tl-item{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--border)}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 2px var(--blue-050)}
.tl-item.muted:before{background:#C4CCD8;box-shadow:0 0 0 2px #EEF1F6}
.tl-date{font-size:.8rem;color:var(--muted);font-weight:600}
.tl-title{font-weight:700;margin:2px 0 3px;font-size:1rem}
.tl-desc{color:var(--muted);font-size:.92rem}
/* payment */
.pay-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.pay-top .amt{font-family:var(--font-head);font-weight:800;font-size:1.5rem}
.pbar{height:12px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#4ED07E);border-radius:999px}
.pay-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:.9rem;color:var(--muted)}
.pay-next{margin-top:16px;background:var(--bg-soft);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pay-next b{font-size:1.05rem}
/* docs */
.doc{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.doc:last-child{border:0}
.doc .d-ic{width:38px;height:38px;border-radius:10px;background:var(--blue-050);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.doc .d-name{font-weight:600;font-size:.96rem;flex:1}
/* chat */
.chat{background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;height:560px;position:sticky;top:92px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.chat-h .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6D5AE6,#9B8BF0);color:#fff;font-family:var(--font-head);font-weight:800;display:flex;align-items:center;justify-content:center}
.chat-h b{font-size:.98rem;display:block}.chat-h .on{font-size:.8rem;color:var(--ok);font-weight:600;display:flex;align-items:center;gap:5px}
.chat-h .on:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg-soft)}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:.95rem;line-height:1.45}
.msg.in{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.msg.out{background:var(--blue);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg .t{display:block;font-size:.7rem;opacity:.7;margin-top:4px}
.chat-day{text-align:center;font-size:.76rem;color:var(--muted);margin:2px 0}
.chat-in{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);background:#fff}
.chat-in input{flex:1;padding:13px 15px;border:1.6px solid var(--border);border-radius:12px;font-size:.98rem;font-family:var(--font-body)}
.chat-in input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.chat-send{width:48px;height:48px;border-radius:12px;background:var(--blue);color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.chat-send:hover{background:var(--blue-600)}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
  .jsteps{flex-direction:column;gap:0;text-align:left}
  .jstep{display:flex;align-items:flex-start;gap:14px;padding:0 0 18px}
  .jstep:before{top:0;left:21px;width:3px;height:100%}
